<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A060B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI 사진관 안내서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: one leather-bound book centred on a dark table; pages turn from the spine (left edge). Single deliberate dark look. */
:root{
  --table:#1A060B;
  --leather:#5A1520;
  --leather-deep:#3B0C14;
  --gold-hi:#F4E1A6;
  --gold:#D2AE62;
  --gold-lo:#8F6C2E;
  --ivory:#F2E7CF;
  --ivory-dim:#D3C29E;
  --edge:#E6D7B3;
  --display:'Song Myung','Gowun Batang',serif;
  --body:'Gowun Batang','Noto Serif KR',serif;
  --script:'Pinyon Script','Cormorant Garamond',cursive;
  --roman:'Cormorant Garamond','Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 35%,#3A0E17 0%,var(--table) 70%);color:var(--ivory);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:24px;box-sizing:border-box}

.book{position:relative;width:min(100%,540px);aspect-ratio:5/7;max-width:100%;perspective:1800px;
  box-shadow:3px 2px 0 var(--edge),6px 4px 0 #BFAE87,9px 6px 0 #9E8C66,0 30px 70px rgba(0,0,0,.65);border-radius:3px 8px 8px 3px}
.page{position:absolute;inset:0;border-radius:3px 8px 8px 3px;overflow:hidden;visibility:hidden;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(255,210,170,.08),transparent 65%),
    repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 9px),
    linear-gradient(90deg,var(--leather-deep) 0%,var(--leather) 7%,var(--leather) 93%,var(--leather-deep) 100%);
  transform-origin:left center;transition:transform .7s cubic-bezier(.45,.05,.25,1),opacity .7s ease;backface-visibility:hidden}
.page.show{visibility:visible}
.page.top{z-index:3}
.page.turned{transform:rotateY(-105deg);opacity:0}
.page::before,.page::after{content:"";position:absolute;pointer-events:none}
.page::before{inset:14px;border:1.5px solid var(--gold)}
.page::after{inset:20px;border:1px solid var(--gold-lo)}
.corner{position:absolute;width:46px;height:46px;color:var(--gold);pointer-events:none;z-index:2}
.corner.tl{top:8px;left:8px}.corner.tr{top:8px;right:8px;transform:scaleX(-1)}
.corner.bl{bottom:8px;left:8px;transform:scaleY(-1)}.corner.br{bottom:8px;right:8px;transform:scale(-1,-1)}
.inner{position:absolute;inset:34px 30px 54px;overflow-y:auto;padding:14px 16px;scrollbar-width:thin;scrollbar-color:var(--gold-lo) transparent}
.folio{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-family:var(--roman);font-size:15px;color:var(--gold);letter-spacing:.2em;z-index:2}

.gold{background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--roman);font-style:italic;font-size:17px;color:var(--gold);text-align:center;letter-spacing:.06em}
h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.25;margin:2px 0 0;text-align:center;text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;margin:14px auto 20px;width:70%;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
.rule i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
p{margin:0;line-height:1.75;font-size:15px}
.dim{color:var(--ivory-dim)}

/* cover */
.cover .inner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:26px}
.cover h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.cover .script{font-family:var(--script);font-size:27px;color:var(--gold);margin-top:-2px}
.cover .sub{font-size:14px;color:var(--ivory-dim);line-height:1.6}
.emblem{width:62%;max-width:250px;margin:6px 0 2px;color:var(--gold)}
.open-hint{font-family:var(--roman);font-style:italic;font-size:15px;color:var(--gold);margin-top:auto}

/* contents */
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.toc button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 4px;box-sizing:border-box;font-size:16px;border-radius:4px}
.toc button:hover .t,.toc button:focus-visible .t{color:var(--gold-hi)}
.toc button:focus-visible{outline:1px solid var(--gold)}
.toc .n{font-family:var(--roman);font-weight:600;color:var(--gold);width:28px;flex-shrink:0;font-size:18px}
.toc .t{white-space:nowrap}
.toc .dots{flex:1;border-bottom:1px dotted var(--gold-lo);transform:translateY(-4px);min-width:20px}
.toc .p{font-family:var(--roman);color:var(--ivory-dim);font-variant-numeric:tabular-nums}

/* steps */
.steps{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start}
.steps .num{font-family:var(--roman);font-weight:600;font-size:26px;line-height:1;color:var(--gold);text-align:center;border:1px solid var(--gold-lo);padding:6px 0}
.steps h3{margin:0 0 3px;font-family:var(--display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;gap:8px}
.steps h3 small{font-family:var(--roman);font-size:14px;color:var(--gold);font-style:italic}
.steps p{font-size:14px;line-height:1.65;color:var(--ivory-dim)}

/* formula & rules */
.formula{border:1px solid var(--gold);padding:14px 10px;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-bottom:18px}
.formula span{font-family:var(--display);font-size:19px}
.formula b{font-family:var(--roman);color:var(--gold);font-size:22px;font-weight:500}
.formula em{flex-basis:100%;font-style:normal;font-size:13px;color:var(--ivory-dim)}
.rules{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{font-size:14px;line-height:1.65}
.rules strong{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold-hi)}
.ba{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;font-size:14px;line-height:1.55;border-top:1px solid var(--gold-lo);padding-top:14px}
.ba .k{font-family:var(--roman);font-style:italic;color:var(--ivory-dim)}
.ba .k.good{color:var(--gold)}

/* builder */
.group{margin-bottom:14px}
.group h3{margin:0 0 7px;font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold-hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-size:13px;color:var(--ivory);background:transparent;border:1px solid var(--gold-lo);padding:7px 11px;min-height:34px;cursor:pointer;border-radius:2px}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--leather-deep);border-color:var(--gold);font-weight:700}
.chip:focus-visible,.copy:focus-visible,.navbtn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.keep{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 14px;cursor:pointer}
.keep input{accent-color:var(--gold);width:17px;height:17px}
.result{background:var(--ivory);color:#3A1A14;padding:16px;border-radius:2px;font-size:15px;line-height:1.7;position:relative;box-shadow:inset 0 0 0 4px var(--ivory),inset 0 0 0 5px #B99A5C}
.result .lab{font-family:var(--roman);font-style:italic;font-size:13px;color:#7A5A2A;display:block;margin-bottom:4px}
.copy{margin-top:10px;font-family:var(--body);font-size:13px;background:#3A1A14;color:var(--ivory);border:0;padding:8px 14px;cursor:pointer;border-radius:2px}

/* menu */
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.menu li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid rgba(210,174,98,.3)}
.menu .n{font-family:var(--roman);font-weight:600;color:var(--gold);font-size:17px}
.menu b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.menu span{font-size:13px;color:var(--ivory-dim);line-height:1.5}

/* qna */
.qna{display:flex;flex-direction:column;gap:8px}
details{border:1px solid var(--gold-lo);padding:0 14px;background:rgba(0,0,0,.12)}
details[open]{border-color:var(--gold)}
summary{cursor:pointer;list-style:none;padding:12px 0;display:grid;grid-template-columns:22px minmax(0,1fr) 16px;gap:8px;align-items:baseline;font-family:var(--display);font-size:16px}
summary::-webkit-details-marker{display:none}
summary .q{font-family:var(--roman);font-style:italic;color:var(--gold);font-size:18px}
summary .tog{color:var(--gold);font-family:var(--roman);transition:transform .25s}
details[open] summary .tog{transform:rotate(45deg)}
summary:focus-visible{outline:1px solid var(--gold-hi)}
details p{padding:0 0 14px 30px;font-size:14px;line-height:1.7;color:var(--ivory-dim)}

/* back */
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.notes li{font-size:14px;line-height:1.7;padding-left:18px;position:relative}
.notes li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.colophon{margin-top:26px;text-align:center;display:flex;flex-direction:column;gap:4px}
.colophon .script{font-family:var(--script);font-size:26px;color:var(--gold)}
.colophon span{font-size:13px;color:var(--ivory-dim)}

/* nav */
.nav{display:flex;align-items:center;gap:18px;width:min(100%,540px);justify-content:space-between}
.navbtn{font-family:var(--body);font-size:14px;color:var(--gold);background:transparent;border:1px solid var(--gold-lo);padding:10px 16px;min-height:44px;cursor:pointer;border-radius:2px}
.navbtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-hi)}
.navbtn:disabled{opacity:.35;cursor:default}
.count{font-family:var(--roman);font-size:16px;color:var(--ivory-dim);letter-spacing:.15em;font-variant-numeric:tabular-nums}

@media (max-width:440px){
  .inner{inset:28px 22px 50px;padding:10px 10px}
  .cover h1{font-size:36px}.cover .script{font-size:22px}
  h2{font-size:26px}
  .corner{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){.page{transition:none}}
</style>

</head>
<body>
<main>
  <div class="book" id="book" aria-live="polite"></div>
  <nav class="nav" aria-label="책장 넘기기">
    <button class="navbtn" id="prev" type="button">‹ 이전 장</button>
    <span class="count" id="count">I / IX</span>
    <button class="navbtn" id="next" type="button">다음 장 ›</button>
  </nav>
</main>

<script>
(function(){
  var corner = '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M5 56V14Q5 5 14 5H56" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 50V21Q12 12 21 12H50" fill="none" stroke="currentColor" stroke-width="1"/><path d="M14 14m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="currentColor"/><path d="M24 24l5 5-5 5-5-5z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 34q8 0 8-8M34 5q0 8-8 8" fill="none" stroke="currentColor" stroke-width="1"/></svg>';

  function emblem(){
    var s = '<svg class="emblem" viewBox="0 0 240 240" aria-hidden="true"><g stroke="currentColor" fill="none">';
    for (var i=0;i<48;i++){
      var a = i*Math.PI/24, r1 = 84, r2 = (i%2? 104 : 116);
      s += '<line x1="'+(120+r1*Math.cos(a)).toFixed(1)+'" y1="'+(120+r1*Math.sin(a)).toFixed(1)+'" x2="'+(120+r2*Math.cos(a)).toFixed(1)+'" y2="'+(120+r2*Math.sin(a)).toFixed(1)+'" stroke-width="'+(i%2?0.8:1.4)+'"/>';
    }
    s += '<circle cx="120" cy="120" r="76" stroke-width="2"/><circle cx="120" cy="120" r="68" stroke-width="0.8"/>';
    for (var j=0;j<6;j++){
      var b = j*Math.PI/3, c = b+Math.PI/3;
      var x1=120+66*Math.cos(b), y1=120+66*Math.sin(b), x2=120+24*Math.cos(c+0.5), y2=120+24*Math.sin(c+0.5);
      s += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke-width="1.4"/>';
    }
    s += '<circle cx="120" cy="120" r="24" stroke-width="1.4"/><circle cx="120" cy="120" r="6" fill="currentColor" stroke="none"/>';
    s += '<path d="M120 2l5 10-5 10-5-10z" fill="currentColor" stroke="none"/><path d="M120 218l5 10-5 10-5-10z" fill="currentColor" stroke="none"/>';
    return s + '</g></svg>';
  }

  var head = function(eb, title){ return '<div class="eyebrow">'+eb+'</div><h2 class="gold">'+title+'</h2><div class="rule"><i></i></div>'; };

  var qna = [
    ['영어로 써야 하나요?','아니요. 한국어로 써도 잘 알아들어요. 짧고 구체적이면 충분합니다.'],
    ['얼굴이 다른 사람처럼 바뀌면요?','문장 앞에 “얼굴은 그대로 두고”를 붙이면 원래 얼굴이 더 잘 유지돼요. 그래도 어색하면 다른 AI의 결과를 고르세요.'],
    ['AI가 왜 두 개인가요?','Gemini와 GPT는 같은 문장도 다르게 그려요. 두 결과를 나란히 보고 마음에 드는 쪽을 고르면 됩니다.'],
    ['한 번에 여러 가지를 바꿔도 되나요?','두세 가지까지가 좋아요. 너무 많으면 일부를 빠뜨리거나 사진이 어색해집니다.'],
    ['몇 명까지 찍을 수 있나요?','한 팀 최대 [인원]명입니다. 사람이 많을수록 AI가 얼굴을 덜 정확하게 유지할 수 있어요.'],
    ['무엇을 받게 되나요?','엽서 크기 인화지 1장을 반으로 잘라 네컷 두 줄을 드려요. 한 줄에 원본 2컷과 AI 2컷이 들어가고, 필름 봉투에 담아 드립니다.'],
    ['결과가 마음에 안 들면요?','문장을 고쳐 한 번 더 만들 수 있어요. 대기 줄이 길 때는 1회로 제한할 수 있습니다.'],
    ['연예인처럼 바꿔 줄 수 있나요?','실제 다른 사람의 얼굴로 바꾸는 요청은 받지 않아요. 대신 원하는 의상과 분위기를 묘사해 주세요.'],
    ['제 사진은 어디로 가나요?','AI 변환을 위해 Google·OpenAI 서비스로 전송됩니다. 부스 컴퓨터의 사진은 행사가 끝나면 모두 삭제하고, 원하면 그 자리에서 바로 지워 드려요.']
  ];
  function qBlock(from,to){
    var h='<div class="qna">';
    for (var i=from;i<to;i++){
      h+='<details'+(i===from?' open':'')+'><summary><span class="q">Q.</span><span>'+qna[i][0]+'</span><span class="tog" aria-hidden="true">+</span></summary><p>'+qna[i][1]+'</p></details>';
    }
    return h+'</div>';
  }

  var menu = [
    ['베레모 화가','빨간 베레모를 씌우고 손에 붓을 들려줘'],
    ['우주 비행사','우주복을 입히고 배경을 우주정거장 창밖 지구로'],
    ['90년대 졸업앨범','1990년대 졸업앨범 사진처럼, 필름 색감으로'],
    ['수채화','사진 전체를 부드러운 수채화 그림으로'],
    ['중세 기사','은색 갑옷을 입히고 배경을 성문 앞으로'],
    ['실험실 과학자','흰 가운과 보안경을 입히고 배경을 실험실로'],
    ['10년 뒤의 나','10년 뒤 꿈을 이룬 모습으로, 직업은 직접 적기'],
    ['오로라 밤하늘','배경을 오로라가 뜬 밤하늘로']
  ];
  var menuHtml = '<ol class="menu">'+menu.map(function(m,i){return '<li><span class="n">'+String(i+1).padStart(2,'0')+'</span><div><b>'+m[0]+'</b><span>'+m[1]+'</span></div></li>';}).join('')+'</ol><p class="dim" style="margin-top:14px;font-size:13px;text-align:center">번호를 섞어서 주문해도 돼요 · 예) 02 + 04</p>';

  var B = {
    item:[
      ['빨간 베레모','빨간 베레모를 씌우고','빨간 베레모를 씌워줘'],
      ['은색 갑옷','은색 갑옷을 입히고','은색 갑옷을 입혀줘'],
      ['우주복','우주복을 입히고','우주복을 입혀줘'],
      ['실험 가운','흰 실험 가운을 입히고','흰 실험 가운을 입혀줘'],
      ['검은 정장','검은 정장을 입히고','검은 정장을 입혀줘'],
      ['꽃 왕관','머리에 꽃 왕관을 씌우고','머리에 꽃 왕관을 씌워줘']
    ],
    bg:[
      ['밤의 도시','배경을 밤의 도시로 바꾸고','배경을 밤의 도시로 바꿔줘'],
      ['오로라 밤하늘','배경을 오로라가 뜬 밤하늘로 바꾸고','배경을 오로라가 뜬 밤하늘로 바꿔줘'],
      ['성문 앞','배경을 중세 성문 앞으로 바꾸고','배경을 중세 성문 앞으로 바꿔줘'],
      ['벚꽃길','배경을 벚꽃이 흩날리는 길로 바꾸고','배경을 벚꽃이 흩날리는 길로 바꿔줘'],
      ['우주정거장','배경을 우주정거장 창밖 지구로 바꾸고','배경을 우주정거장 창밖 지구로 바꿔줘']
    ],
    style:[
      ['수채화','','전체를 부드러운 수채화 그림처럼 그려줘'],
      ['90년대 필름','','1990년대 필름 사진 느낌으로 만들어줘'],
      ['유화','','전체를 클래식한 유화처럼 그려줘'],
      ['흑백 영화','','옛날 흑백 영화의 한 장면처럼 만들어줘']
    ]
  };
  var pick = {item:0, bg:3, style:0};
  function chips(key,label){
    return '<div class="group"><h3>'+label+'</h3><div class="chips">'+B[key].map(function(o,i){
      return '<button type="button" class="chip" data-k="'+key+'" data-i="'+i+'" aria-pressed="'+(pick[key]===i)+'">'+o[0]+'</button>';
    }).join('')+'</div></div>';
  }
  var builderHtml =
    '<p class="dim" style="font-size:14px;margin-bottom:14px;text-align:center">하나씩 골라 보세요. 다시 누르면 빠집니다.</p>'+
    chips('item','무엇을 · 의상과 소품')+chips('bg','어디서 · 배경')+chips('style','어떻게 · 분위기와 화풍')+
    '<label class="keep" for="keepFace"><input type="checkbox" id="keepFace" checked> 얼굴은 그대로 두기</label>'+
    '<div class="result"><span class="lab">완성된 한 줄</span><span id="sentence"></span></div>'+
    '<button type="button" class="copy" id="copyBtn">문장 복사</button>';

  var pages = [
    {cls:'cover', html:
      '<div class="eyebrow" style="letter-spacing:.3em;font-style:normal">VOL. I</div>'+
      '<h1 class="gold">AI 사진관을 위한<br>안내서</h1>'+
      '<div class="script">The guidebook for AI Photo Studio</div>'+
      emblem()+
      '<div class="sub">찍고, 한 줄 쓰면 완성되는 네컷<br>[부스 이름] · 약 8분</div>'+
      '<div class="open-hint">다음 장을 넘겨 시작하세요</div>'},
    {html: head('Contents','차례')+
      '<ol class="toc">'+
      [['I','이용 순서',3],['II','프롬프트 짜는 법',4],['III','한 줄 조합기',5],['IV','컨셉 메뉴',6],['V','묻고 답하기',7],['','맺음 · 알아 두실 것',9]].map(function(t){
        return '<li><button type="button" data-go="'+(t[2]-1)+'"><span class="n">'+t[0]+'</span><span class="t">'+t[1]+'</span><span class="dots"></span><span class="p">'+t[2]+'</span></button></li>';
      }).join('')+'</ol>'},
    {html: head('Chapter I','이용 순서')+
      '<ol class="steps">'+
      '<li><span class="num">I</span><div><h3>접수 <small>1분</small></h3><p>번호표를 받고 컨셉 메뉴에서 고르거나, 원하는 모습을 한 줄로 적어 주세요.</p></div></li>'+
      '<li><span class="num">II</span><div><h3>촬영 <small>2분</small></h3><p>조명 아래 바닥 표시선에 서서 4컷을 찍어요. 직접 찍어도, 저희가 찍어 드려도 됩니다.</p></div></li>'+
      '<li><span class="num">III</span><div><h3>AI 편집 <small>3분</small></h3><p>고른 2컷에 한 줄을 넣어 Gemini와 GPT가 동시에 그려요. 둘 중 마음에 드는 결과를 고르세요.</p></div></li>'+
      '<li><span class="num">IV</span><div><h3>인화 <small>2분</small></h3><p>원본 2컷과 AI 2컷이 나란히 담긴 네컷을 인화해 필름 봉투에 넣어 드려요.</p></div></li>'+
      '</ol>'},
    {html: head('Chapter II','프롬프트 짜는 법')+
      '<div class="formula"><span>무엇을</span><b>+</b><span>어디서</span><b>+</b><span>어떻게</span><em>의상·소품 + 배경 + 분위기, 이 순서면 충분합니다</em></div>'+
      '<ul class="rules">'+
      '<li><strong>눈에 보이는 것으로 쓰기</strong>“멋있게”보다 “검은 정장”처럼 그릴 수 있는 사물을 말해 주세요.</li>'+
      '<li><strong>두세 가지만</strong>바꿀 것이 많을수록 AI가 일부를 빠뜨려요.</li>'+
      '<li><strong>지킬 것도 말하기</strong>“얼굴은 그대로 두고”를 앞에 붙이면 본인 얼굴이 유지돼요.</li>'+
      '</ul>'+
      '<div class="ba"><span class="k">아쉬운 한 줄</span><span class="dim">“귀엽고 멋있게 해줘”</span><span class="k good">좋은 한 줄</span><span>“얼굴은 그대로 두고, 빨간 베레모를 씌우고, 배경을 벚꽃길로 바꿔줘”</span></div>'},
    {html: head('Chapter III','한 줄 조합기')+builderHtml},
    {html: head('Chapter IV','컨셉 메뉴')+menuHtml},
    {html: head('Chapter V','묻고 답하기')+qBlock(0,5)},
    {html: head('Chapter V','묻고 답하기 · 계속')+qBlock(5,9)},
    {html: head('Epilogue','알아 두실 것')+
      '<ul class="notes">'+
      '<li>1팀 1장 인화, 한 팀 최대 [인원]명까지 촬영합니다.</li>'+
      '<li>사진은 AI 변환을 위해 Google · OpenAI 서비스로 전송됩니다.</li>'+
      '<li>부스 컴퓨터의 사진은 행사가 끝나면 모두 삭제합니다. 바로 삭제를 원하면 말씀해 주세요.</li>'+
      '<li>다른 사람의 얼굴로 바꾸는 요청이나 불쾌한 요청은 정중히 거절합니다.</li>'+
      '</ul>'+
      '<div class="colophon"><div class="script">Thank you for visiting</div><span>[부스 이름] · [위치]</span><span>[운영 시간]</span></div>'}
  ];

  var romans = ['I','II','III','IV','V','VI','VII','VIII','IX'];
  var book = document.getElementById('book');
  book.innerHTML = pages.map(function(p,i){
    return '<section class="page '+(p.cls||'')+(i===0?' show':'')+'" aria-label="'+(i+1)+'쪽">'+
      '<span class="corner tl">'+corner+'</span><span class="corner tr">'+corner+'</span><span class="corner bl">'+corner+'</span><span class="corner br">'+corner+'</span>'+
      '<div class="inner">'+p.html+'</div>'+(i>0?'<div class="folio">— '+(i+1)+' —</div>':'')+'</section>';
  }).join('');
  var els = book.querySelectorAll('.page');
  var cur = 0, busy = false;
  var prev = document.getElementById('prev'), next = document.getElementById('next'), count = document.getElementById('count');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ui(){
    prev.disabled = cur===0; next.disabled = cur===els.length-1;
    count.textContent = romans[cur]+' / '+romans[els.length-1];
  }
  function go(n){
    if (busy || n===cur || n<0 || n>=els.length) return;
    var out = els[cur], inn = els[n], fwd = n>cur;
    if (reduce){ out.classList.remove('show'); inn.classList.add('show'); cur=n; ui(); return; }
    busy = true;
    if (fwd){
      inn.classList.add('show');
      out.classList.add('top');
      void out.offsetWidth;
      out.classList.add('turned');
    } else {
      inn.classList.add('show','top','turned');
      void inn.offsetWidth;
      inn.classList.remove('turned');
    }
    setTimeout(function(){
      out.classList.remove('show','top','turned');
      inn.classList.remove('top');
      busy = false;
    }, 720);
    cur = n; ui();
  }
  prev.addEventListener('click', function(){ go(cur-1); });
  next.addEventListener('click', function(){ go(cur+1); });
  book.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]'); if (g){ go(+g.getAttribute('data-go')); return; }
    var c = e.target.closest('.chip');
    if (c){ var k=c.getAttribute('data-k'), i=+c.getAttribute('data-i'); pick[k] = (pick[k]===i? -1 : i); refresh(); }
  });
  document.addEventListener('keydown', function(e){
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key==='ArrowRight') go(cur+1);
    if (e.key==='ArrowLeft') go(cur-1);
  });
  var sx=null;
  book.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  book.addEventListener('touchend', function(e){
    if (sx===null) return; var dx = e.changedTouches[0].clientX - sx; sx=null;
    if (Math.abs(dx)>60) go(cur + (dx<0?1:-1));
  });

  var keep = document.getElementById('keepFace');
  keep.addEventListener('change', refresh);
  function refresh(){
    book.querySelectorAll('.chip').forEach(function(c){
      c.setAttribute('aria-pressed', String(pick[c.getAttribute('data-k')]===+c.getAttribute('data-i')));
    });
    var parts = [];
    ['item','bg','style'].forEach(function(k){ if (pick[k]>-1) parts.push(B[k][pick[k]]); });
    var out = document.getElementById('sentence');
    if (!parts.length){ out.textContent = '위에서 하나 이상 골라 주세요.'; return; }
    var txt = parts.map(function(p,i){ return i===parts.length-1 ? p[2] : p[1]; }).join(', ');
    out.textContent = (keep.checked ? '얼굴은 그대로 두고, ' : '') + txt;
  }
  refresh();

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function(){
    var t = document.getElementById('sentence');
    var done = function(){ copyBtn.textContent = '복사했어요'; setTimeout(function(){ copyBtn.textContent='문장 복사'; }, 1600); };
    var fallback = function(){ var r=document.createRange(); r.selectNodeContents(t); var s=getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent='선택됨 · 길게 눌러 복사'; };
    try { navigator.clipboard.writeText(t.textContent).then(done, fallback); } catch(e){ fallback(); }
  });
  ui();
})();
</script>

</body>
</html>
